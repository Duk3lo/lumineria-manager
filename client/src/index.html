<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/base/globals.css" />
  <link rel="stylesheet" href="css/layout/layout.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/forms.css" />
  <link rel="stylesheet" href="css/components/modals.css" />
  <link rel="stylesheet" href="css/components/terminal.css" />
  <link rel="stylesheet" href="css/components/server-list.css" />
  <title>Lumineria Manager</title>
  <script type="module" src="js/main.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Lumineria Manager</h1>

    <div class="tabs">
      <button id="tab-local" class="active">Modo Local</button>
      <button id="tab-remote">Modo Remoto</button>
      <button id="tab-new" style="margin-left: auto; background-color: #a6e3a1;">+ Creador de Servidor</button>
    </div>

    <!-- Modal Creador -->
    <div id="creator-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <h2>Crear Nuevo Servidor</h2>
        <label>Nombre del Servidor</label>
        <input type="text" id="new-name" placeholder="smp-mods" />

        <label>Motor</label>
        <select id="new-type">
          <option value="paper">PaperMC (Spigot/Paper)</option>
          <option value="velocity">Velocity Proxy</option>
          <option value="fabric">Fabric</option>
          <option value="neoforge">NeoForge</option>
          <option value="forge">Forge</option>
        </select>

        <label id="version-lbl">Versión de Minecraft</label>
        <select id="new-version">
          <option value="1.21.1">1.21.1</option>
          <option value="1.20.1">1.20.1</option>
          <option value="1.19.2">1.19.2</option>
        </select>

        <label id="loader-lbl">Versión del Cargador (Loader)</label>
        <select id="new-loader"></select>

        <h3 style="margin-top: 15px;">Parámetros Extras (Guardados localmente)</h3>
        <label>Puerto del Servidor</label>
        <input type="number" id="new-port" value="25565" />

        <label>RAM Mínima / Máxima</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="new-min-ram" value="1G" />
          <input type="text" id="new-max-ram" value="4G" />
        </div>

        <label style="display: block; margin-top: 10px;">
          <input type="checkbox" id="new-online-mode" /> Online Mode (Cuentas Premium)
        </label>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
          <button id="btn-submit-create" style="flex: 1;">Crear e Instalar</button>
          <button id="btn-cancel-create" style="background-color: #f38ba8;">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Modal Logs/Terminal -->
    <div id="logs-modal" class="modal" style="display: none;">
      <div class="modal-content" style="max-width: 800px; width: 95%;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="margin: 0;">Terminal: <span id="log-server-name"></span></h2>
          <button id="btn-close-logs" style="background-color: #f38ba8;">Cerrar</button>
        </div>
        <div id="log-container" class="terminal"></div>
      </div>
    </div>

    <div id="view-local" class="view active">
      <p>Inicia el agente en tu propia máquina.</p>
      <button id="btn-pick-folder">Elegir Carpeta de Servidores</button>
      <p id="folder-path" class="path-text">Ninguna carpeta seleccionada</p>
      <button id="btn-start-local" disabled>Iniciar y Conectar</button>
    </div>

    <div id="view-remote" class="view" style="display: none;">
      <p>Conéctate a un VPS remoto (ej: ws://tuserver:8080/ws)</p>
      <input type="text" id="input-url" placeholder="ws://127.0.0.1:8756/ws" />
      <button id="btn-connect-remote">Conectar</button>
    </div>

    <div id="status-panel">Estado: Desconectado</div>
    <p id="install-progress-lbl" style="color: #fab387; font-weight: bold;"></p>

    <h2>Servidores <button id="btn-refresh-list" style="font-size: 0.8em; padding: 4px 10px;">↻ Actualizar</button></h2>
    <ul id="server-list"></ul>
  </div>
</body>
</html>

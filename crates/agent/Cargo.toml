[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lumineria-agent"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "net"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "=4.6.4", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
